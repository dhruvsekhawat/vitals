name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode on the runner
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build -c release

      - name: Test
        run: swift test

      - name: Assemble app bundle
        run: ./build.sh --no-install

      - name: Verify signature
        run: codesign --verify --deep --strict --verbose=2 build/Vitals.app

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Vitals.app
          path: build/Vitals.app
          if-no-files-found: error
