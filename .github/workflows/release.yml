name: Release

# Runs on every v* tag. With the signing secrets below configured, the release is signed with
# Developer ID, notarized, and stapled, so a downloaded app opens with a double-click. Without
# them it is signed ad hoc and install.sh clears quarantine instead.
#
# Secrets (Settings > Secrets and variables > Actions):
#   APPLE_CERTIFICATE_P12        base64 of the Developer ID Application .p12 export
#   APPLE_CERTIFICATE_PASSWORD   password used when exporting the .p12
#   APPLE_ID                     Apple ID email for notarization
#   APPLE_TEAM_ID                10-character team id
#   APPLE_APP_PASSWORD           app-specific password from appleid.apple.com

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      HAVE_SIGNING: ${{ secrets.APPLE_CERTIFICATE_P12 != '' && secrets.APPLE_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode on the runner
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Test
        run: swift test

      - name: Import Developer ID certificate
        if: env.HAVE_SIGNING == 'true'
        env:
          P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          identity=$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -1)
          [ -n "$identity" ] || { echo "no Developer ID Application identity in the imported .p12"; exit 1; }
          echo "CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Store notarization credentials
        if: env.HAVE_SIGNING == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool store-credentials ci-notary --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
          echo "NOTARY_PROFILE=ci-notary" >> "$GITHUB_ENV"

      - name: Build universal app bundle
        run: UNIVERSAL=1 ./build.sh --no-install

      - name: Check the tag matches Info.plist
        run: |
          v=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/Vitals.app/Contents/Info.plist)
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} does not match CFBundleShortVersionString $v"; exit 1; }
          lipo -info build/Vitals.app/Contents/MacOS/Vitals
          codesign -dv --verbose=2 build/Vitals.app 2>&1 | grep -E "Authority|Signature|TeamIdentifier" || true

      - name: Confirm Gatekeeper accepts a notarized build
        if: env.HAVE_SIGNING == 'true'
        run: spctl --assess --type execute --verbose=2 build/Vitals.app

      - name: Package
        run: |
          cd build
          ditto -c -k --keepParent Vitals.app "Vitals-${GITHUB_REF_NAME}.zip"
          shasum -a 256 "Vitals-${GITHUB_REF_NAME}.zip" > "Vitals-${GITHUB_REF_NAME}.zip.sha256"
          cat "Vitals-${GITHUB_REF_NAME}.zip.sha256"

      - name: Release notes from CHANGELOG
        run: |
          awk '/^## /{n++} n==1' CHANGELOG.md > build/notes.md
          if [ "$HAVE_SIGNING" = "true" ]; then
            printf '\nSigned with Developer ID and notarized by Apple. Double-click to open.\n' >> build/notes.md
          else
            printf '\nSigned ad hoc (not notarized). Use install.sh, or right-click and choose Open the first time.\n' >> build/notes.md
          fi
          cat build/notes.md

      # An unsigned build is published as a draft only. It must never become "latest", because
      # install.sh and the README point people at latest and Gatekeeper rejects ad hoc builds.
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Vitals ${{ github.ref_name }}
          body_path: build/notes.md
          draft: ${{ env.HAVE_SIGNING != 'true' }}
          make_latest: ${{ env.HAVE_SIGNING == 'true' }}
          files: |
            build/Vitals-${{ github.ref_name }}.zip
            build/Vitals-${{ github.ref_name }}.zip.sha256
